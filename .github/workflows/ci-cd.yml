name: Event Service CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: event_service_db
          MYSQL_USER: group8
          MYSQL_PASSWORD: group8
          MYSQL_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/event_service_db
      DB_USERNAME: group8
      DB_PASSWORD: group8

      JWT_SECRET: ci-test-secret-key-that-is-only-used-for-github-actions

      GROUP5_MOCK: true
      GROUP6_MOCK: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build and test application
        run: mvn -B clean verify

      - name: Verify Docker build
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build -t event-service:test .

  deploy:
    name: Deploy to Render

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
