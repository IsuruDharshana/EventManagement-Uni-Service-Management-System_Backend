name: Keep event-service awake

# Render's free plan puts the service to sleep after 15 minutes without traffic, and waking it
# takes minutes. Calling the health check every 10 minutes keeps it awake for the frontend,
# other groups and demos. Disable this workflow in the Actions tab to let it sleep again.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping health check
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      HEALTH_URL: ${{ vars.EVENT_SERVICE_URL || 'https://eventmanagement-uni-service-management.onrender.com' }}/actuator/health

    steps:
      - name: Call /actuator/health
        run: |
          curl --fail --silent --show-error --max-time 300 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               "$HEALTH_URL"
          echo
