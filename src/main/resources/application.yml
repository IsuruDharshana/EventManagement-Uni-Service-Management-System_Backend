server:
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  application:
    name: event-service

  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/event_service_db}
    username: ${DB_USERNAME:group8}
    password: ${DB_PASSWORD:group8}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # A database that once ran the demo seed (seed profile) must still start without it.
    # Versioned migrations are still fully validated.
    ignore-migration-patterns: "*:future,repeatable:missing"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Access tokens are issued by Group 5 (Identity Service): RS256, checked against Group 5's public keys.
jwt:
  jwks-uri: ${JWT_JWKS_URI:${integrations.group5.base-url}/.well-known/jwks.json}
  issuer: ${JWT_ISSUER:university-identity-service}
  audience: ${JWT_AUDIENCE:university-services-platform}

integrations:
  group5:
    mock: ${GROUP5_MOCK:true}
    base-url: ${GROUP5_BASE_URL:http://localhost:8001}
  group6:
    mock: ${GROUP6_MOCK:true}
    base-url: ${GROUP6_BASE_URL:http://localhost:9002}
