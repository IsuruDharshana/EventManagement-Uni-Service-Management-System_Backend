server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: event-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/event_service_db}
    username: ${DB_USERNAME:group8}
    password: ${DB_PASSWORD:group8}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-change-me-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

integrations:
  group5:
    mock: ${GROUP5_MOCK:true}
    base-url: ${GROUP5_BASE_URL:http://localhost:9001}
  group6:
    mock: ${GROUP6_MOCK:true}
    base-url: ${GROUP6_BASE_URL:http://localhost:9002}
