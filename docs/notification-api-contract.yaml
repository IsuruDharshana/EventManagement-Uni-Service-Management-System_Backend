openapi: 3.0.3
info:
  title: Group 8 Notification Trigger API (draft)
  version: 0.1.0
  description: |
    Provided by communication-feedback-service. Other services call it to create an in-app notification
    after a meaningful status change. Callers: event-service (registration and event changes),
    Group 6 reservation-service, Group 7 service-request-service.

    Status: DRAFT for agreement between event-service and communication-feedback-service. Once agreed,
    changes need a change note (API freeze applies from the sprint 3 checkpoint).

    Rules
    - Call it only after the producer's own change has committed successfully.
    - A notification failure must never undo the producer's change. Producers log the failure and carry on.
    - Sending the same idempotencyKey twice never creates a second notification.
    - Errors use the standard shape { "success": false, "error": { "code", "message" } }.
servers:
  - url: http://localhost:8082
    description: local communication-feedback-service (path is exposed through the API Gateway in integrated environments)
paths:
  /api/notifications/trigger:
    post:
      summary: Create a notification for one user
      operationId: triggerNotification
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerRequest'
            examples:
              registrationConfirmed:
                summary: event-service, registration confirmed
                value:
                  recipientId: usr-student-001
                  type: REGISTRATION_CONFIRMED
                  message: You are registered for Innovation Week Workshop
                  relatedType: REGISTRATION
                  relatedId: b0000000-0000-0000-0000-000000000001
                  sourceService: event-service
                  idempotencyKey: REGISTRATION_CONFIRMED:b0000000-0000-0000-0000-000000000001
              eventCancelled:
                summary: event-service, event cancelled (one call per registered user)
                value:
                  recipientId: usr-student-001
                  type: EVENT_CANCELLED
                  message: Innovation Week Workshop has been cancelled
                  relatedType: EVENT
                  relatedId: a0000000-0000-0000-0000-000000000001
                  sourceService: event-service
                  idempotencyKey: EVENT_CANCELLED:a0000000-0000-0000-0000-000000000001:usr-student-001
      responses:
        '201':
          description: Notification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '200':
          description: The idempotencyKey was already used. The existing notification is returned and nothing new is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: VALIDATION_ERROR (missing or too long field), INVALID_TYPE (unknown type), or INVALID_RECIPIENT (recipientId is not a valid user id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error:
                  code: INVALID_TYPE
                  message: "type must be one of the documented values"
        '401':
          description: UNAUTHORIZED, missing or wrong X-Service-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Shared secret between services. Provided through configuration, never committed to the repository.
  schemas:
    TriggerRequest:
      type: object
      required: [recipientId, type, message, sourceService, idempotencyKey]
      properties:
        recipientId:
          type: string
          maxLength: 64
          description: Group 5 user id (token sub) who should see the notification, e.g. usr-student-001
        type:
          type: string
          enum:
            - REGISTRATION_CONFIRMED
            - REGISTRATION_CANCELLED
            - EVENT_CANCELLED
            - EVENT_UPDATED
            - RESERVATION_STATUS_CHANGED
            - SERVICE_REQUEST_STATUS_CHANGED
            - ANNOUNCEMENT_PUBLISHED
        message:
          type: string
          maxLength: 500
          description: Text shown to the user. Must not contain secrets or internal ids.
        relatedType:
          type: string
          enum: [EVENT, REGISTRATION, ANNOUNCEMENT, EXTERNAL]
        relatedId:
          type: string
          format: uuid
          nullable: true
        sourceService:
          type: string
          enum: [event-service, reservation-service, service-request-service, communication-feedback-service]
        idempotencyKey:
          type: string
          maxLength: 120
          description: Unique per real-world change, for example REGISTRATION_CONFIRMED:<registrationId>. A repeat call with the same key is harmless.
    Notification:
      type: object
      properties:
        id: {type: string, format: uuid}
        recipientId: {type: string, maxLength: 64}
        type: {type: string}
        message: {type: string}
        relatedType: {type: string}
        relatedId: {type: string, format: uuid, nullable: true}
        read: {type: boolean}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      properties:
        success: {type: boolean, example: false}
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
